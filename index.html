<style>
/* Layout: app shell. Sticky top bar, two tabs (今天 timeline / 回憶 calendar), bottom tab bar with a center shutter.
   Day page and lightbox slide over the shell; camera is full-screen. Soft UI: paper ground, white cards, soft shadows. */
:root {
  --bg: #fbf8f1;
  --card: #ffffff;
  --ink: #1c1712;
  --muted: #6b6158;
  --line: #ece3d6;
  --primary: #92400e;
  --on-primary: #ffffff;
  --soft: #f4ece0;
  --live: #dc2626;
  --ok: #15803d;
  --scrim: rgba(20, 14, 8, .5);
  --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 6px 20px rgba(60, 40, 20, .08);
  --f-num: "Bricolage Grotesque", "Noto Sans TC", system-ui, sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-hand: "LXGW WenKai TC", "Kaiti TC", "STKaiti", serif;
  --bar-h: 72px;
  --top-h: 56px;
  --t-fast: 150ms;
  --t-med: 240ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15120e; --card: #211c16; --ink: #f3ede4; --muted: #b3a797; --line: #3a3128;
    --primary: #f2a65a; --on-primary: #1c1208; --soft: #2b241c; --live: #f87171; --ok: #4ade80;
    --scrim: rgba(0, 0, 0, .7); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
img { max-width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 24px; height: 24px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 18px; height: 18px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: env(safe-area-inset-top, 0px) 16px 0; }
.top-in { max-width: 560px; margin: 0 auto; height: var(--top-h); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--f-hand); font-weight: 700; font-size: 26px; line-height: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-size: 13px; color: var(--muted); }
.pill b { color: var(--ink); font-size: 16px; }

main { max-width: 560px; margin: 0 auto; padding: 8px 16px calc(var(--bar-h) + 32px + env(safe-area-inset-bottom, 0px)); }
.tab { display: grid; gap: 20px; }

/* Moment banner */
.moment { border-radius: 20px; background: var(--card); box-shadow: var(--shadow); padding: 16px 18px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 14px; }
.moment .lbl { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.moment .clock { font-size: 34px; font-weight: 800; line-height: 1.1; letter-spacing: -.01em; }
.moment .go { grid-row: 1 / span 2; grid-column: 2; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.moment.live { background: var(--live); color: #fff; }
.moment.live .lbl { color: rgba(255,255,255,.9); }
.moment.live .dot { background: #fff; animation: pulse 1s ease-in-out infinite; }
.moment.passed .clock { font-size: 22px; color: var(--muted); }
@keyframes pulse { 50% { transform: scale(1.7); opacity: .35; } }

.btn { min-height: 44px; border-radius: 999px; padding: 0 20px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--primary); color: var(--on-primary); transition: opacity var(--t-fast); }
.btn:active { opacity: .8; }
.btn.light { background: #fff; color: #b91c1c; }
.btn.ghost { background: var(--soft); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }

/* Section toolbar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar h2 { margin: 0; font-family: var(--f-hand); font-size: 22px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
.bar h2 .num { font-size: 15px; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; flex: none; }
.seg button { width: 44px; height: 38px; border-radius: 999px; display: grid; place-items: center; color: var(--muted); transition: background var(--t-fast), color var(--t-fast); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

/* Hour groups */
.groups { display: grid; gap: 22px; }
.group { display: grid; gap: 10px; }
.group-h { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); z-index: 2; padding-block: 4px; background: var(--bg); }
.group-h .part { font-family: var(--f-hand); font-size: 17px; font-weight: 700; color: var(--ink); }
.group-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* Grid view */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.tile { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; background: var(--soft); }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity var(--t-fast); }
.tile .t { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 6px 4px; font-size: 11px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.55)); text-align: right; }
.tile .two { position: absolute; top: 5px; left: 5px; width: 24%; aspect-ratio: 3 / 4; border-radius: 4px; border: 1.5px solid #000; overflow: hidden; background: #000; }
.tile .two img { width: 100%; height: 100%; object-fit: cover; }
.tile:active > img { opacity: .8; }

/* Feed view */
.cards { display: grid; gap: 14px; }
.card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 8px 8px 12px; display: grid; gap: 8px; text-align: left; width: 100%; }
.shot { position: relative; aspect-ratio: 3 / 4; max-width: 100%; background: #000; overflow: hidden; border-radius: 12px; }
.shot > img.main { width: 100%; height: 100%; object-fit: cover; display: block; }
.inset { position: absolute; top: 10px; left: 10px; width: 30%; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; border: 2px solid #000; background: #000; cursor: pointer; }
.inset img { width: 100%; height: 100%; object-fit: cover; display: block; }
.caption { font-family: var(--f-hand); font-size: 19px; line-height: 1.45; padding-inline: 6px; overflow-wrap: anywhere; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); padding-inline: 6px; }
.chip { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 9px; white-space: nowrap; background: var(--soft); color: var(--muted); }
.chip.on { color: var(--ok); }

.empty { text-align: center; padding: 40px 20px; border: 1.5px dashed var(--line); border-radius: 20px; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty b { color: var(--ink); font-family: var(--f-hand); font-size: 20px; }
.more { justify-self: center; margin-top: 16px; }

/* Calendar */
.cal-card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 12px; }
.navs { display: flex; gap: 4px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); transition: background var(--t-fast); flex: none; }
.icon-btn:active { background: var(--soft); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wd { font-size: 12px; color: var(--muted); text-align: center; }
.day { aspect-ratio: 3 / 4; border-radius: 8px; background: var(--soft); position: relative; overflow: hidden; }
.day img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.day .n { position: absolute; left: 5px; top: 2px; font-size: 12px; font-weight: 500; color: var(--muted); }
.day.has .n { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); font-weight: 700; }
.day .c { position: absolute; right: 3px; bottom: 3px; font-size: 10px; font-weight: 700; line-height: 1.6; color: #fff; background: rgba(0,0,0,.6); border-radius: 999px; padding: 0 5px; }
.day.today { box-shadow: inset 0 0 0 2px var(--primary); }
.day.future { background: transparent; border: 1px dashed var(--line); cursor: default; }
.day.blank { visibility: hidden; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 14px; min-width: 0; }
.stat b { display: block; font-family: var(--f-num); font-size: 24px; font-weight: 800; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--muted); }
.tools { display: flex; gap: 10px; flex-wrap: wrap; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line); padding: 0 16px env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 560px; margin: 0 auto; height: var(--bar-h); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.tabbtn { height: 56px; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 12px; color: var(--muted); transition: color var(--t-fast); }
.tabbtn[aria-current="page"] { color: var(--primary); font-weight: 700; }
.fab { width: 68px; height: 68px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; margin-top: -26px;
  box-shadow: 0 0 0 5px var(--bg), 0 8px 18px rgba(0,0,0,.18); transition: transform var(--t-fast); }
.fab:active { transform: scale(.94); }
.fab svg.i { width: 30px; height: 30px; }
.fab.live { background: var(--live); color: #fff; animation: ring 1.4s ease-out infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 5px var(--bg), 0 0 0 5px var(--live); } 100% { box-shadow: 0 0 0 5px var(--bg), 0 0 0 20px transparent; } }

/* Day page */
.page { position: fixed; inset: 0; z-index: 15; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.page-title { flex: 1; min-width: 0; font-family: var(--f-hand); font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-title .sub { font-family: var(--f-body); font-size: 13px; font-weight: 500; color: var(--muted); }
.page main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.page-cta { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 16; box-shadow: 0 8px 18px rgba(0,0,0,.2); }

/* Lightbox (always dark) */
.lb { position: fixed; inset: 0; z-index: 25; background: #0b0a09; color: #f3ede4; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.lb-top, .lb-bottom { display: flex; align-items: center; gap: 8px; padding: 8px; }
.lb-top { padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
.lb-bottom { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; }
.lb .icon-btn { color: #f3ede4; }
.lb .icon-btn:active { background: rgba(255,255,255,.12); }
.lb-title { flex: 1; text-align: center; font-size: 14px; }
.lb-title .num { color: rgba(243,237,228,.6); margin-left: 8px; }
.lb-stage { position: relative; display: grid; place-items: center; overflow: hidden; touch-action: pan-y; padding: 0 12px; min-height: 0; }
#lbShot { height: 100%; max-width: 100%; display: grid; place-items: center; min-height: 0; }
.lb-stage .shot { height: 100%; max-height: 100%; width: auto; aspect-ratio: 3 / 4; border-radius: 16px; transition: transform var(--t-med) ease, opacity var(--t-med); }
.lb-info { position: absolute; left: 0; right: 0; bottom: 0; padding: 48px 16px 14px; background: linear-gradient(transparent, rgba(0,0,0,.72)); pointer-events: none; display: grid; gap: 4px; }
.lb-info .caption { color: #fff; padding: 0; }
.lb-info .meta { color: rgba(255,255,255,.8); padding: 0; }
.lb-info .chip { background: rgba(255,255,255,.15); color: #fff; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,.45); display: grid; place-items: center; color: #fff; }
.lb-nav.prev { left: 16px; } .lb-nav.next { right: 16px; }
@media (hover: none) { .lb-nav { display: none; } }
.lb-act { display: grid; justify-items: center; gap: 2px; font-size: 11px; color: rgba(243,237,228,.85); min-width: 64px; min-height: 52px; align-content: center; border-radius: 12px; }
.lb-act:active { background: rgba(255,255,255,.1); }
.lb-act:disabled { opacity: .3; cursor: default; }
.lb-act.on { color: #f2a65a; }
.lb-act.on svg { fill: currentColor; }
.lb-act.danger { color: #f87171; }

/* Camera (always dark) */
.cam { position: fixed; inset: 0; background: #000; color: #fff; z-index: 30; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.cam-top { display: flex; justify-content: space-between; align-items: center; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; gap: 10px; }
.cam-top .step { font-weight: 700; font-size: 15px; text-align: center; flex: 1; }
.cam .icon-btn { color: #fff; background: rgba(255,255,255,.14); }
.finder { position: relative; overflow: hidden; display: grid; place-items: center; padding: 0 8px; min-height: 0; }
.finder .frame { cursor: pointer; position: relative; height: 100%; max-height: 100%; aspect-ratio: 3 / 4; max-width: 100%; overflow: hidden; border-radius: 20px; background: #111; }
.finder video { width: 100%; height: 100%; object-fit: cover; display: block; }
.finder video.mirror { transform: scaleX(-1); }
.count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-num); font-weight: 800; font-size: 120px; color: #fff; text-shadow: 0 4px 30px rgba(0,0,0,.5); pointer-events: none; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
.flash.on { opacity: .85; transition: none; }
.cam-msg { position: absolute; inset: 16px; display: grid; place-items: center; text-align: center; font-size: 15px; line-height: 1.7; }
.cam-bottom { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px)); gap: 12px; }
.shutter { width: 88px; height: 88px; border-radius: 50%; border: 5px solid #fff; display: grid; place-items: center; }
.shutter::after { content: ""; width: 68px; height: 68px; border-radius: 50%; background: #fff; transition: transform .1s; }
.shutter:active::after { transform: scale(.88); }
.shutter:disabled { opacity: .4; }
.cam-hint { font-size: 12px; color: rgba(255,255,255,.75); }
.cam-bottom .right { justify-self: end; }

/* Review sheet */
.sheet { position: fixed; inset: 0; background: var(--scrim); display: grid; align-items: end; z-index: 35; }
.panel { background: var(--bg); width: 100%; max-width: 560px; margin: 0 auto; max-height: 100%; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.panel-head h3 { margin: 0; font-family: var(--f-hand); font-size: 20px; }
.review .shot { height: min(50vh, 460px); width: auto; margin: 0 auto; }
label.fl { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
textarea { width: 100%; min-height: 64px; resize: vertical; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 10px 12px; font-family: var(--f-hand); font-size: 18px; }
.row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.err { color: var(--live); font-size: 13px; }
.fallback-in { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.toast { position: fixed; left: 50%; bottom: calc(var(--bar-h) + 20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<div class="top"><div class="top-in">
  <div class="brand">此刻</div>
  <div class="pill" title="連續記錄天數"><svg class="i sm" aria-hidden="true"><use href="#i-flame"/></svg><b class="num" id="streak">0</b>天連續</div>

<main>
  <section class="tab" id="tabToday">
    <div class="moment" id="moment" aria-live="polite"></div>
    <div class="bar">
      <h2>今天 <span class="num" id="todayCount"></span></h2>
      <div class="seg" role="group" aria-label="顯示方式">

  </section>
</main>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  const WINDOW_MIN = 2;
  const START = 9 * 60, END = 22 * 60;
  const MAX_H = 1600, THUMB_H = 480;
  const PAGE = 60; // shots rendered per batch

  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dateOf = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const hm = (min) => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
  const nice = (k) => { const d = dateOf(k); return `${d.getMonth() + 1}月${d.getDate()}日 週${WEEK[d.getDay()]}`; };
  const timeOf = (p) => { const t = new Date(p.postedAt || 0); return `${pad(t.getHours())}:${pad(t.getMinutes())}`; };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const icon = (id, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2400);
  }

  // ---------- Daily moment ----------
  let seed = "";
  try { seed = localStorage.getItem("ciKe.seed") || ""; if (!seed) { seed = Math.random().toString(36).slice(2); localStorage.setItem("ciKe.seed", seed); } } catch {}
  function momentFor(k) {
    let h = 2166136261;
    const s = k + "|" + seed;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return START + ((h >>> 0) % (END - START));
  }

  // ---------- IndexedDB ----------
  const store = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open("ciKe", 2);
      r.onupgradeneeded = (e) => {
        const db = r.result;
        const shots = db.createObjectStore("shots", { keyPath: "id" });
        shots.createIndex("date", "date");
        // v1 kept one post per day; move each into the many-per-day store
        if (e.oldVersion >= 1) {
          r.transaction.objectStore("posts").openCursor().onsuccess = (ev) => {
            const c = ev.target.result;
            if (c) { shots.put({ ...c.value, id: `${c.value.date}-${c.value.postedAt || 0}` }); c.continue(); }
            else db.deleteObjectStore("posts");
          };
        }
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
    const tx = async (mode, fn) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction("shots", mode);
        const out = fn(t.objectStore("shots"));
        t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
        t.onerror = () => rej(t.error);
        t.onabort = () => rej(t.error);
      });
    };
    // iOS Safari often refuses Blobs in IndexedDB ("Error preparing Blob/File data"),
    // so photos are stored as raw bytes and turned back into Blobs on load.
    const BLOBS = ["main", "selfie", "thumb", "sthumb"];
    const pack = async (p) => {
      const o = { ...p };
      for (const f of BLOBS) if (o[f] instanceof Blob) o[f] = { t: o[f].type, b: await o[f].arrayBuffer() };
      return o;
    };
    const unpack = (o) => {
      for (const f of BLOBS) if (o[f] && o[f].b instanceof ArrayBuffer) o[f] = new Blob([o[f].b], { type: o[f].t });
      return o;
    };
    return {
      all: async () => (await tx("readonly", (s) => s.getAll())).map(unpack),
      put: async (p) => { const o = await pack(p); return tx("readwrite", (s) => s.put(o)); },
      del: (k) => tx("readwrite", (s) => s.delete(k)),
    };
  })();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  const byId = new Map();
  let days = new Map(); // date -> shots, newest first
  let covers = ls.get("ciKe.covers", {});
  const newId = (k) => `${k}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
  function reindex() {
    days = new Map();
    for (const p of byId.values()) {
      if (!days.has(p.date)) days.set(p.date, []);
      days.get(p.date).push(p);
    }
    for (const list of days.values()) list.sort((a, b) => (b.postedAt || 0) - (a.postedAt || 0));
  }
  const coverOf = (k) => { const list = days.get(k); if (!list) return null; const c = byId.get(covers[k]); return c && c.date === k ? c : list[list.length - 1]; };

  const urls = new Map(); // `${id}:${field}` -> {blob, url}
  function src(p, field) {
    const blob = p[field] || (field === "thumb" ? p.main : field === "sthumb" ? p.selfie : null);
    if (!blob) return null;
    const key = p.id + ":" + field;
    let u = urls.get(key);
    if (!u || u.blob !== blob) { if (u) URL.revokeObjectURL(u.url); u = { blob, url: URL.createObjectURL(blob) }; urls.set(key, u); }
    return u.url;
  }
  function forget(id) {
    for (const f of ["main", "selfie", "thumb", "sthumb"]) {
      const u = urls.get(id + ":" + f); if (u) { URL.revokeObjectURL(u.url); urls.delete(id + ":" + f); }
    }
  }

  async function load() {
    try {
      const list = await store.all();
      byId.clear(); list.forEach((p) => byId.set(p.id, p)); reindex();
    } catch {
      $("#storeNote").textContent = "這個瀏覽器不能存資料（可能是無痕模式）。照片會在關掉頁面後消失。";
    }
    renderAll();
    backfillThumbs();
  }

  // Older records have no thumbnails; make them quietly so grids stay light.
  async function backfillThumbs() {
    for (const p of byId.values()) {
      if (p.thumb) continue;
      try {
        p.thumb = await scaleBlob(p.main, THUMB_H);
        if (p.selfie) p.sthumb = await scaleBlob(p.selfie, 200);
        await store.put(p);
      } catch {}
    }
  }

  // ---------- Image helpers ----------
  const toJpeg = (c, q = 0.88) => new Promise((r, j) => c.toBlob((b) => (b ? r(b) : j(new Error("encode"))), "image/jpeg", q));
  async function decode(blob) {
    const url = URL.createObjectURL(blob);
    try { const img = new Image(); img.src = url; await img.decode(); return img; }
    finally { URL.revokeObjectURL(url); }
  }
  // Center-crop any source to 3:4 portrait, scaled down to height h.
  function crop34(el, w0, h0, h, mirror) {
    let sw = w0, sh = h0;
    if (w0 / h0 > 3 / 4) sw = Math.round(h0 * 3 / 4); else sh = Math.round(w0 * 4 / 3);
    const scale = Math.min(1, h / sh);
    const c = document.createElement("canvas");
    c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
    const g = c.getContext("2d");
    if (mirror) { g.translate(c.width, 0); g.scale(-1, 1); }
    g.drawImage(el, (w0 - sw) / 2, (h0 - sh) / 2, sw, sh, 0, 0, c.width, c.height);
    return c;
  }
  async function scaleBlob(blob, h) {
    const img = await decode(blob);
    return toJpeg(crop34(img, img.naturalWidth, img.naturalHeight, h), 0.8);
  }

  // ---------- Rendering ----------
  let mode = ls.get("ciKe.mode", "grid");

  function statusChip(p) {
    if (p.late == null) return `<span class="chip">補拍</span>`;
    if (p.late >= 0 && p.late <= WINDOW_MIN) return `<span class="chip on">準時</span>`;
    return "";
  }

  function shotHTML(mainSrc, selfieSrc, alt, lazy) {
    const ld = lazy ? ' loading="lazy" decoding="async"' : "";
    return `<div class="shot"><img class="main" src="${mainSrc}" alt="${alt}"${ld}>
      ${selfieSrc ? `<span class="inset"><img src="${selfieSrc}" alt=""${ld}></span>` : ""}</div>`;
  }

  // Parts of the day, so groups stay full whether there are 3 shots or 300.
  const PARTS = [[0, "深夜"], [5, "早上"], [9, "上午"], [12, "中午"], [14, "下午"], [18, "晚上"]];
  const partOf = (p) => { const h = new Date(p.postedAt || 0).getHours(); let i = 0; while (i < PARTS.length - 1 && h >= PARTS[i + 1][0]) i++; return i; };

  // Shots grouped by part of day, newest first, rendered in batches so hundreds stay smooth.
  function renderShots(box, list, limit) {
    if (!list.length) return false;
    const hourOf = partOf;
    const counts = {};
    for (const p of list) counts[hourOf(p)] = (counts[hourOf(p)] || 0) + 1;
    const groups = [];
    for (const p of list.slice(0, limit)) {
      const h = hourOf(p), g = groups[groups.length - 1];
      if (g && g.h === h) g.items.push(p); else groups.push({ h, items: [p] });
    }
    let html = `<div class="groups">`;
    for (const g of groups) {
      html += `<div class="group"><div class="group-h"><span class="part">${PARTS[g.h][1]}</span>${counts[g.h]} 張</div>`;
      if (mode === "grid") {
        html += `<div class="tiles">` + g.items.map((p) => `<button class="tile" data-view="${p.id}" aria-label="${timeOf(p)} 的照片${p.caption ? "：" + esc(p.caption) : ""}">
          <img src="${src(p, "thumb")}" alt="" loading="lazy" decoding="async">
          ${p.selfie ? `<span class="two"><img src="${src(p, "sthumb")}" alt="" loading="lazy" decoding="async"></span>` : ""}
          <span class="t num">${timeOf(p)}</span></button>`).join("") + `</div>`;
      } else {
        html += `<div class="cards">` + g.items.map((p) => `<button class="card" data-view="${p.id}">
          ${shotHTML(src(p, "main"), p.selfie ? src(p, "selfie") : null, timeOf(p) + " 的照片", true)}
          ${p.caption ? `<div class="caption">${esc(p.caption)}</div>` : ""}
          <div class="meta"><span class="num">${timeOf(p)}</span>${statusChip(p)}</div></button>`).join("") + `</div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
    if (list.length > limit) html += `<button class="btn ghost more" data-more>再顯示 ${Math.min(PAGE, list.length - limit)} 張（還有 ${list.length - limit} 張）</button>`;
    box.innerHTML = html;
    box.style.display = "grid";
    return true;
  }

  const limits = { today: PAGE, day: PAGE };
  function renderTodayList() {
    const list = days.get(keyOf(new Date())) || [];
    $("#todayCount").textContent = list.length ? `${list.length} 張` : "";
    const box = $("#todayList");
    if (!renderShots(box, list, limits.today)) {
      box.innerHTML = `<div class="empty"><b>今天還沒有照片</b>按下面的快門，前後鏡頭各拍一張。<br>一天想拍幾次都可以。</div>`;
    }
  }

  function renderMoment() {
    const now = new Date();
    const k = keyOf(now);
    const m = momentFor(k);
    const secLeft = m * 60 - (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds());
    const el = $("#moment");
    let cls, html;
    if (secLeft > 0) {
      const h = Math.floor(secLeft / 3600), mi = Math.floor(secLeft % 3600 / 60), s = secLeft % 60;
      cls = "moment";
      html = `<div class="lbl"><span class="dot"></span>今天的時刻 ${hm(m)}，倒數</div><div class="clock num">${h ? h + ":" : ""}${pad(mi)}:${pad(s)}</div>`;
    } else if (-secLeft < WINDOW_MIN * 60) {
      const left = WINDOW_MIN * 60 + secLeft;
      cls = "moment live";
      html = `<div class="lbl"><span class="dot"></span>就是現在！停下來拍一張</div><div class="clock num">${pad(Math.floor(left / 60))}:${pad(left % 60)}</div>
        <button class="btn light go" data-cap="${k}">${icon("camera", "i sm")}拍</button>`;
      notifyOnce(k);
    } else {
      const done = (days.get(k) || []).some((p) => p.late != null && p.late >= 0 && p.late <= WINDOW_MIN);
      cls = "moment passed";
      html = `<div class="lbl"><span class="dot"></span>${done ? "今天準時拍到了" : "今天的時刻已過"}</div><div class="clock num">${hm(m)}</div>`;
    }
    if (el.dataset.html !== html) { el.dataset.html = html; el.className = cls; el.innerHTML = html; }
    $("#fab").classList.toggle("live", cls === "moment live");
  }

  function notifyOnce(k) {
    if (notifyOnce.k === k) return;
    notifyOnce.k = k;
    try {
      if ("Notification" in window && Notification.permission === "granted" && document.hidden) {
        new Notification("此刻", { body: "就是現在！2 分鐘內拍一張", icon: "icon-192.png" });
      }
    } catch {}
  }

  let viewMonth = new Date(); viewMonth.setDate(1);
  function renderCal() {
    const y = viewMonth.getFullYear(), mo = viewMonth.getMonth();
    $("#calTitle").innerHTML = `${mo + 1}月 <span class="num">${y}</span>`;
    const first = new Date(y, mo, 1).getDay();
    const dim = new Date(y, mo + 1, 0).getDate();
    const todayK = keyOf(new Date());
    let html = WEEK.map((w) => `<div class="wd">${w}</div>`).join("");
    for (let i = 0; i < first; i++) html += `<div class="day blank"></div>`;
    let count = 0, shots = 0;
    for (let d = 1; d <= dim; d++) {
      const k = `${y}-${pad(mo + 1)}-${pad(d)}`;
      const list = days.get(k);
      const cover = coverOf(k);
      const future = k > todayK;
      if (list) { count++; shots += list.length; }
      const cls = ["day", list ? "has" : "", k === todayK ? "today" : "", future ? "future" : ""].join(" ");
      html += `<button class="${cls}" data-k="${k}" ${future ? "disabled" : ""} aria-label="${nice(k)}${list ? `，${list.length} 張` : ""}">
        ${cover ? `<img src="${src(cover, "thumb")}" alt="" loading="lazy">` : ""}<span class="n num">${d}</span>${list && list.length > 1 ? `<span class="c num">${list.length}</span>` : ""}</button>`;
    }
    $("#cal").innerHTML = html;
    $("#stDays").textContent = count;
    $("#stShots").textContent = shots;
    $("#stAll").textContent = byId.size;
    const nowM = new Date();
    $("#nextM").disabled = y > nowM.getFullYear() || (y === nowM.getFullYear() && mo >= nowM.getMonth());
  }

  function renderStreak() {
    const d = new Date();
    if (!days.has(keyOf(d))) d.setDate(d.getDate() - 1);
    let n = 0;
    while (days.has(keyOf(d))) { n++; d.setDate(d.getDate() - 1); }
    $("#streak").textContent = n;
  }

  function syncSeg() { $$(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === mode))); }

  function renderAll() {
    renderMoment(); renderTodayList(); renderCal(); renderStreak(); syncSeg();
    if (!$("#dayPage").hidden) renderDay();
  }

  // ---------- Layers & the back button ----------
  const stack = [];
  function pushLayer(name, close) { stack.push({ name, close }); history.pushState({ layer: stack.length }, ""); }
  function replaceLayer(name, close) { const t = stack.pop(); if (t) t.close(); stack.push({ name, close }); }
  function back() { if (stack.length) history.back(); }
  window.addEventListener("popstate", () => { const t = stack.pop(); if (t) t.close(); });
  const topLayer = () => stack.length ? stack[stack.length - 1].name : null;

  // ---------- Tabs ----------
  function setTab(t) {
    $("#tabToday").hidden = t !== "today";
    $("#tabMem").hidden = t !== "mem";
    $$(".tabbtn").forEach((b) => { if (b.dataset.tab === t) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    window.scrollTo(0, 0);
  }

  // ---------- Day page ----------
  let dayKey = null;
  function openDay(k) {
    dayKey = k; limits.day = PAGE;
    renderDay();
    $("#dayPage").hidden = false; $("#dayPage").scrollTop = 0;
    pushLayer("day", () => { $("#dayPage").hidden = true; });
  }
  function renderDay() {
    const list = days.get(dayKey) || [];
    const d = dateOf(dayKey);
    $("#dayTitle").innerHTML = `${d.getMonth() + 1}月${d.getDate()}日 <span class="sub">週${WEEK[d.getDay()]}${list.length ? ` · ${list.length} 張` : ""}</span>`;
    const box = $("#dayList");
    if (!renderShots(box, list, limits.day)) box.innerHTML = `<div class="empty"><b>這天沒有照片了</b>按下面可以補拍。</div>`;
  }

  // ---------- Lightbox ----------
  let lbList = [], lbIdx = 0;
  function openLightbox(id) {
    const p = byId.get(id); if (!p) return;
    lbList = days.get(p.date) || [p];
    lbIdx = Math.max(0, lbList.findIndex((x) => x.id === id));
    renderLightbox();
    $("#lb").hidden = false;
    pushLayer("lb", () => { $("#lb").hidden = true; });
  }
  function renderLightbox(dir) {
    const p = lbList[lbIdx]; if (!p) return;
    $("#lbTitle").innerHTML = `${nice(p.date)} ${timeOf(p)}<span class="num">${lbIdx + 1} / ${lbList.length}</span>`;
    const box = $("#lbShot");
    box.innerHTML = shotHTML(src(p, "main"), p.selfie ? src(p, "selfie") : null, `${timeOf(p)} 的照片`);
    const shot = $(".shot", box);
    const chip = statusChip(p);
    if (p.caption || chip) {
      const info = document.createElement("div");
      info.className = "lb-info";
      info.innerHTML = `${p.caption ? `<div class="caption">${esc(p.caption)}</div>` : ""}<div class="meta"><span></span>${chip}</div>`;
      shot.appendChild(info);
    }
    if (dir) {
      shot.style.transform = `translateX(${dir * 40}px)`; shot.style.opacity = "0";
      requestAnimationFrame(() => requestAnimationFrame(() => { shot.style.transform = ""; shot.style.opacity = ""; }));
    }
    const inset = $(".inset", shot);
    if (inset) inset.addEventListener("click", (e) => { e.stopPropagation(); swapLb(); });
    $("#lbSwap").disabled = !p.selfie;
    const isCover = coverOf(p.date) === p;
    $("#lbCover").classList.toggle("on", isCover);
    $("#lbCover span").textContent = isCover ? "封面" : "設為封面";
    $("#lbPrev").hidden = lbIdx === 0;
    $("#lbNext").hidden = lbIdx >= lbList.length - 1;
    const del = $("#lbDel"); del.dataset.armed = ""; $("span", del).textContent = "刪除";
  }
  function swapLb() {
    const a = $("#lbShot img.main"), b = $("#lbShot .inset img");
    if (a && b) [a.src, b.src] = [b.src, a.src];
  }
  function lbStep(d) {
    const n = lbIdx + d;
    if (n < 0 || n >= lbList.length) return;
    lbIdx = n; renderLightbox(d);
  }
  $("#lbPrev").addEventListener("click", () => lbStep(-1));
  $("#lbNext").addEventListener("click", () => lbStep(1));
  $("#lbSwap").addEventListener("click", swapLb);
  $("#lbCover").addEventListener("click", () => {
    const p = lbList[lbIdx]; if (!p) return;
    covers[p.date] = p.id; ls.set("ciKe.covers", covers);
    renderLightbox(); renderCal(); toast("設為這天的封面");
  });
  $("#lbSave").addEventListener("click", () => saveComposite(lbList[lbIdx]));
  $("#lbDel").addEventListener("click", async (e) => {
    const b = e.currentTarget;
    if (!b.dataset.armed) { b.dataset.armed = "1"; $("span", b).textContent = "再按一次"; return; }
    const p = lbList[lbIdx]; if (!p) return;
    try {
      await store.del(p.id);
      byId.delete(p.id); forget(p.id); reindex();
      if (covers[p.date] === p.id) { delete covers[p.date]; ls.set("ciKe.covers", covers); }
      renderAll(); toast("刪掉了");
      lbList = days.get(p.date) || [];
      if (!lbList.length) return back();
      lbIdx = Math.min(lbIdx, lbList.length - 1);
      renderLightbox();
    } catch { b.dataset.armed = ""; $("span", b).textContent = "刪除失敗"; }
  });
  (() => { // swipe between shots
    const st = $("#lbStage");
    let x0 = null, y0 = 0;
    st.addEventListener("pointerdown", (e) => { x0 = e.clientX; y0 = e.clientY; });
    st.addEventListener("pointerup", (e) => {
      if (x0 == null) return;
      const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) lbStep(dx < 0 ? 1 : -1);
    });
    st.addEventListener("pointercancel", () => (x0 = null));
  })();

  function roundRect(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  async function saveComposite(p) {
    if (!p) return;
    try {
      const main = await decode(p.main);
      const W = main.naturalWidth, H = main.naturalHeight;
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const g = c.getContext("2d");
      g.drawImage(main, 0, 0, W, H);
      if (p.selfie) {
        const s = await decode(p.selfie);
        const iw = Math.round(W * 0.3), ih = Math.round(iw * 4 / 3), m = Math.round(W * 0.03), r = Math.round(W * 0.04);
        g.save(); roundRect(g, m, m, iw, ih, r); g.clip(); g.drawImage(s, m, m, iw, ih); g.restore();
        roundRect(g, m, m, iw, ih, r); g.lineWidth = Math.max(3, W / 200); g.strokeStyle = "#000"; g.stroke();
      }
      const out = await toJpeg(c);
      const file = new File([out], `此刻-${p.date}-${timeOf(p).replace(":", "")}.jpg`, { type: "image/jpeg" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] }).catch(() => {});
      } else {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(out); a.download = file.name; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      }
    } catch { toast("存圖失敗，再試一次"); }
  }

  // ---------- Camera ----------
  const cam = { key: null, stream: null, order: ["environment", "user"], step: 0, shots: [], busy: false, token: 0, skipSecond: false };
  const video = $("#video");

  function stopStream() {
    if (cam.stream) { cam.stream.getTracks().forEach((t) => t.stop()); cam.stream = null; }
    video.srcObject = null;
  }
  async function startStream(facing) {
    stopStream();
    const tries = [
      { video: { facingMode: { exact: facing }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false },
      { video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false },
      { video: true, audio: false },
    ];
    let lastErr;
    for (const c of tries) {
      try {
        const s = await navigator.mediaDevices.getUserMedia(c);
        cam.stream = s; video.srcObject = s;
        video.classList.toggle("mirror", facing === "user");
        await video.play().catch(() => {});
        await waitFrame();
        return;
      } catch (e) {
        lastErr = e;
        if (e && (e.name === "NotAllowedError" || e.name === "SecurityError")) break;
      }
    }
    throw lastErr;
  }
  function waitFrame() {
    return new Promise((res) => {
      if (video.videoWidth) return res();
      const done = () => { video.removeEventListener("loadedmetadata", done); res(); };
      video.addEventListener("loadedmetadata", done);
      setTimeout(done, 3000);
    });
  }
  function grab(mirror) {
    if (!video.videoWidth) return Promise.reject(new Error("no frame"));
    return toJpeg(crop34(video, video.videoWidth, video.videoHeight, MAX_H, mirror));
  }
  async function fileToBlob(file) {
    const img = await decode(file);
    return toJpeg(crop34(img, img.naturalWidth, img.naturalHeight, MAX_H));
  }

  function camLabel() {
    const which = cam.order[cam.step] === "environment" ? "拍眼前" : "拍自己";
    $("#camStep").textContent = `${cam.step + 1} / 2 · ${which}`;
    $("#camOrder").style.visibility = cam.step === 0 ? "" : "hidden";
    $("#camHint").innerHTML = cam.step === 0 ? "點畫面或快門<br>就會拍" : "3 秒後自動拍<br>或點畫面直接拍";
  }
  function camMessage(html) { const m = $("#camMsg"); m.hidden = !html; m.innerHTML = html || ""; }

  async function openCamera(k, replace) {
    cam.key = k; cam.step = 0; cam.shots = []; cam.busy = false; cam.skipSecond = false;
    (replace ? replaceLayer : pushLayer)("cam", closeCamera);
    const token = ++cam.token;
    $("#camInset").hidden = true; $("#count").hidden = true; camMessage("");
    $("#cam").hidden = false;
    camLabel();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      camMessage("這個瀏覽器不能直接開相機。<br>請用 Safari 或 Chrome 開啟。<br><br>也可以按右下角從相簿選照片。");
      return;
    }
    $("#shutter").disabled = true;
    try {
      await startStream(cam.order[0]);
      if (token !== cam.token) return stopStream();
      $("#shutter").disabled = false;
    } catch (e) {
      if (token !== cam.token) return;
      camMessage(e && e.name === "NotAllowedError"
        ? "相機權限被拒絕了。<br>請到瀏覽器設定允許這個網站使用相機，再重新打開。<br><br>或按右下角從相簿選照片。"
        : "打不開相機。<br>可能被其他 App 佔用，關掉後再試一次。<br><br>或按右下角從相簿選照片。");
    }
  }
  function closeCamera() {
    cam.token++; clearInterval(cam.countTimer);
    stopStream();
    $("#cam").hidden = true;
  }
  async function flash() { const f = $("#flash"); f.classList.add("on"); await sleep(60); f.classList.remove("on"); }

  async function takeShot(blobOverride) {
    if (cam.busy) return;
    cam.busy = true;
    const token = cam.token;
    clearInterval(cam.countTimer); $("#count").hidden = true;
    try {
      const facing = cam.order[cam.step];
      const b = blobOverride || await grab(facing === "user");
      if (!blobOverride) flash();
      cam.shots[cam.step] = { facing, blob: b };
      if (cam.step === 0) {
        cam.step = 1;
        const img = $("#camInset img");
        if (img.src) URL.revokeObjectURL(img.src);
        img.src = URL.createObjectURL(b);
        $("#camInset").hidden = false;
        camLabel();
        $("#shutter").disabled = true;
        camMessage("");
        try { await startStream(cam.order[1]); }
        catch {
          if (token !== cam.token) return;
          camMessage("第二個鏡頭打不開。<br>可以按右下角從相簿選，或按快門跳過。");
          $("#shutter").disabled = false; cam.skipSecond = true;
          return;
        }
        if (token !== cam.token) return stopStream();
        $("#shutter").disabled = false;
        startCountdown(token);
      } else finishCamera();
    } catch { toast("沒拍到，再按一次快門"); }
    finally { cam.busy = false; }
  }
  function startCountdown(token) {
    let n = 3;
    const el = $("#count");
    el.textContent = n; el.hidden = false;
    clearInterval(cam.countTimer);
    cam.countTimer = setInterval(() => {
      if (token !== cam.token || cam.step !== 1) { clearInterval(cam.countTimer); el.hidden = true; return; }
      n--;
      if (n <= 0) { clearInterval(cam.countTimer); el.hidden = true; takeShot(); }
      else el.textContent = n;
    }, 1000);
  }
  function finishCamera() {
    const backS = cam.shots.find((s) => s && s.facing === "environment");
    const front = cam.shots.find((s) => s && s.facing === "user");
    const main = (backS || front).blob;
    const selfie = backS && front ? front.blob : null;
    openReview(cam.key, main, selfie);
  }
  $("#shutter").addEventListener("click", () => { if (cam.step === 1 && cam.skipSecond) return finishCamera(); takeShot(); });
  // Web pages never get the volume keys, so tapping anywhere on the preview works as the shutter.
  $("#cam .frame").addEventListener("click", () => { if (!$("#shutter").disabled && $("#camMsg").hidden) $("#shutter").click(); });
  $("#camClose").addEventListener("click", back);
  $("#camOrder").addEventListener("click", async () => {
    if (cam.step !== 0 || cam.busy) return;
    cam.order.reverse(); camLabel();
    $("#shutter").disabled = true;
    try { await startStream(cam.order[0]); } catch { camMessage("這個鏡頭打不開。"); }
    $("#shutter").disabled = false;
  });
  $("#camFile").addEventListener("click", () => $("#camFileIn").click());
  $("#camFileIn").addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    try { await takeShot(await fileToBlob(f)); } catch { toast("這張照片讀不出來，換一張試試"); }
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && topLayer() === "cam") back();
  });

  // ---------- Review ----------
  const rev = { key: null, main: null, selfie: null, urls: [] };
  function openReview(k, main, selfie) {
    rev.urls.forEach((u) => URL.revokeObjectURL(u));
    rev.key = k; rev.main = main; rev.selfie = selfie;
    rev.urls = [URL.createObjectURL(main)].concat(selfie ? [URL.createObjectURL(selfie)] : []);
    const n = (days.get(k) || []).length;
    $("#revTitle").textContent = `${k === keyOf(new Date()) ? "今天" : nice(k)}第 ${n + 1} 張`;
    $("#revShot").innerHTML = shotHTML(rev.urls[0], rev.urls[1], "剛拍的照片");
    const inset = $("#revShot .inset");
    if (inset) inset.addEventListener("click", () => { const a = $("#revShot img.main"), b = $("img", inset); [a.src, b.src] = [b.src, a.src]; });
    $("#revText").value = "";
    $("#revErr").hidden = true;
    replaceLayer("review", () => { $("#review").hidden = true; });
    $("#review").hidden = false;
  }
  async function saveReview() {
    const k = rev.key, now = new Date(), moment = momentFor(k), isToday = k === keyOf(now);
    const p = {
      id: newId(k), date: k, main: rev.main, selfie: rev.selfie,
      thumb: await scaleBlob(rev.main, THUMB_H).catch(() => null),
      sthumb: rev.selfie ? await scaleBlob(rev.selfie, 200).catch(() => null) : null,
      caption: $("#revText").value.trim(),
      // a back-filled day has no real time; keep the clock time so shots still sort
      postedAt: isToday ? Date.now() : new Date(dateOf(k).setHours(now.getHours(), now.getMinutes(), now.getSeconds())).getTime(),
      moment,
      late: isToday ? now.getHours() * 60 + now.getMinutes() - moment : null,
    };
    await store.put(p);
    byId.set(p.id, p); reindex();
  }
  async function postReview(again) {
    const btns = [$("#revPost"), $("#revAgain"), $("#revRetake")];
    btns.forEach((b) => (b.disabled = true));
    try {
      await saveReview();
      renderAll();
      if (again) { openCamera(rev.key, true); toast("存好了，再拍一張"); }
      else { back(); toast("存好了"); maybeAskNotify(); }
    } catch (e) {
      const full = e && e.name === "QuotaExceededError";
      $("#revErr").textContent = full
        ? "沒有存成功：瀏覽器給這個網頁的空間用完了。先匯出備份，再刪掉一些舊照片。"
        : `沒有存成功（${(e && (e.name || e.message)) || "未知錯誤"}），再按一次試試。`;
      $("#revErr").hidden = false;
    } finally { btns.forEach((b) => (b.disabled = false)); }
  }
  $("#revPost").addEventListener("click", () => postReview(false));
  $("#revAgain").addEventListener("click", () => postReview(true));
  $("#revRetake").addEventListener("click", () => openCamera(rev.key, true));

  function maybeAskNotify() {
    try {
      if ("Notification" in window && Notification.permission === "default" && !ls.get("ciKe.asked", false)) {
        ls.set("ciKe.asked", true);
        Notification.requestPermission().catch(() => {});
      }
    } catch {}
  }

  // ---------- Backup ----------
  const blobToData = (b) => new Promise((r, j) => { const f = new FileReader(); f.onload = () => r(f.result); f.onerror = j; f.readAsDataURL(b); });
  const dataToBlob = async (d) => (await fetch(d)).blob();
  $("#exportBtn").addEventListener("click", async () => {
    if (!byId.size) return toast("還沒有照片可以匯出");
    toast("整理中…");
    const list = [];
    for (const p of byId.values()) {
      const { thumb, sthumb, ...rest } = p;
      list.push({ ...rest, main: await blobToData(p.main), selfie: p.selfie ? await blobToData(p.selfie) : null });
    }
    const out = new Blob([JSON.stringify({ app: "ciKe", v: 2, seed, covers, posts: list })], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(out); a.download = `此刻備份-${keyOf(new Date())}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
  $("#importBtn").addEventListener("click", () => $("#importIn").click());
  $("#importIn").addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.app !== "ciKe" || !Array.isArray(data.posts)) throw 0;
      let n = 0;
      for (const p of data.posts) {
        await store.put({ ...p, id: p.id || `${p.date}-${p.postedAt || 0}`, main: await dataToBlob(p.main), selfie: p.selfie ? await dataToBlob(p.selfie) : null });
        n++;
      }
      if (data.covers) { covers = { ...data.covers, ...covers }; ls.set("ciKe.covers", covers); }
      await load();
      toast(`匯入了 ${n} 張`);
    } catch { toast("這個檔案不是此刻的備份"); }
  });

  // ---------- Events ----------
  document.addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest("[data-back]")) return back();
    const cap = t.closest("[data-cap]");
    if (cap) return openCamera(cap.dataset.cap);
    const v = t.closest("[data-view]");
    if (v) return openLightbox(v.dataset.view);
    const segB = t.closest(".seg button");
    if (segB) { mode = segB.dataset.mode; ls.set("ciKe.mode", mode); syncSeg(); renderTodayList(); if (!$("#dayPage").hidden) renderDay(); return; }
    if (t.closest("[data-more]")) {
      const inDay = !!t.closest("#dayPage");
      limits[inDay ? "day" : "today"] += PAGE;
      return inDay ? renderDay() : renderTodayList();
    }
    const tb = t.closest(".tabbtn");
    if (tb) return setTab(tb.dataset.tab);
    const day = t.closest(".day[data-k]");
    if (day && !day.disabled) { const k = day.dataset.k; return days.has(k) ? openDay(k) : openCamera(k); }
    if (t.id === "review") return back();
  });
  $("#fab").addEventListener("click", () => openCamera(keyOf(new Date())));
  $("#dayShoot").addEventListener("click", () => openCamera(dayKey));
  document.addEventListener("keydown", (e) => {
    if (topLayer() === "lb" && e.key === "ArrowLeft") return lbStep(-1);
    if (topLayer() === "lb" && e.key === "ArrowRight") return lbStep(1);
    if (e.key === "Escape" && stack.length) back();
    // Bluetooth shutter remotes that send Enter / Space / volume-up as key presses
    if (topLayer() === "cam" && ["Enter", " ", "AudioVolumeUp", "VolumeUp"].includes(e.key)) {
      e.preventDefault();
      if (!$("#shutter").disabled) $("#shutter").click();
    }
  });
  $("#prevM").addEventListener("click", () => { viewMonth.setMonth(viewMonth.getMonth() - 1); renderCal(); });
  $("#nextM").addEventListener("click", () => { viewMonth.setMonth(viewMonth.getMonth() + 1); renderCal(); });

  let lastDay = keyOf(new Date());
  setInterval(() => {
    const k = keyOf(new Date());
    if (k !== lastDay) { lastDay = k; limits.today = PAGE; renderAll(); } else renderMoment();
  }, 1000);

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

  syncSeg();
  renderMoment();
  renderCal();
  load();
})();
</script>
</body>
</html>
